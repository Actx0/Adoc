components:
  securitySchemes:
    AccessKeyAuth:
      type: apiKey
      in: header
      name: X-Access-Key
      description: Workspace access key for agent/runtime integrations.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: User API key for management and automation.
    SessionCookie:
      type: apiKey
      in: cookie
      name: _actx0_session
      description: Browser session cookie used by the Actx0 dashboard.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 11111111-1111-1111-1111-111111111111
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Internal session UUID (not externalId).
      schema:
        type: string
        format: uuid
      example: 33333333-3333-3333-3333-333333333333
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 44444444-4444-4444-4444-444444444444
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 55555555-5555-5555-5555-555555555555
    PromptId:
      name: promptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 66666666-6666-6666-6666-666666666666
    PromptVersionId:
      name: promptVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 77777777-7777-7777-7777-777777777777
    PromptName:
      name: promptName
      in: path
      required: true
      description: Prompt handle or name used with promptsByName.
      schema:
        type: string
      example: support-system-prompt
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 88888888-8888-8888-8888-888888888888
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 99999999-9999-9999-9999-999999999999
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 99999999-9999-9999-9999-999999999999
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Page size. Defaults to 50, max 100.
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip.
    SessionExternalId:
      name: id
      in: query
      required: false
      schema:
        type: string
      description: External session id. Provide id and/or arbitrary label query params.
      example: ticket-4821
    PromptVersionSelector:
      name: version
      in: query
      required: false
      schema:
        type: string
      description: 'Version selector: omitted/latest, production, or a version number like 1 or v1.'
      example: latest
  schemas:
    Error:
      type: object
      required:
      - errorMessage
      properties:
        errorMessage:
          type: string
          example: Name is required
    PaginationMeta:
      type: object
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        total:
          type: integer
          example: 12
    CreateAPIKeyRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 255
          example: CI key
        expiresAt:
          type: string
          format: date-time
          example: '2027-01-01T00:00:00Z'
    APIKey:
      type: object
      required:
      - id
      - name
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 99999999-9999-9999-9999-999999999999
        name:
          type: string
          example: CI key
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: '2027-01-01T00:00:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        key:
          type: string
          description: Raw secret. Returned only on create. Send as X-API-Key.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    APIKeyList:
      type: object
      required:
      - keys
      - _meta
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/APIKey'
        _meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateWorkspaceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60
          example: Acme Support
    UpdateWorkspaceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60
          example: Acme Support
    Workspace:
      type: object
      required:
      - id
      - name
      - handle
      - membersCount
      - role
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          example: Acme Support
        handle:
          type: string
          example: abcd-1234
        membersCount:
          type: integer
          example: 1
        role:
          type: string
          enum:
          - owner
          - admin
          - readonly
          example: owner
        createdAt:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
    WorkspaceList:
      type: object
      required:
      - workspaces
      - _meta
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        _meta:
          $ref: '#/components/schemas/PaginationMeta'
    CreateAccessKeyRequest:
      type: object
      required:
      - name
      - permissions
      properties:
        name:
          type: string
          maxLength: 60
          example: Agent runtime
