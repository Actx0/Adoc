        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-agents
      x-codeSamples:
        - lang: python
          label: pctx0
          source: |
            from pctx0 import Pctx0Client

            client = Pctx0Client(
                access_key="YOUR_ACCESS_KEY",
                workspace_id="YOUR_WORKSPACE_ID",
            )

            agents = client.agent.list(limit=50, offset=0)
        - lang: javascript
          label: nctx0
          source: |
            import { Nctx0Client } from "@actx0/nctx0";

            const client = new Nctx0Client({
              accessKey: "YOUR_ACCESS_KEY",
              workspaceId: "YOUR_WORKSPACE_ID",
            });

            const agents = await client.agent.list({ limit: 50, offset: 0 });
        - lang: go
          label: gtcx0
          source: |
            package main

            import (
            	"context"

            	"github.com/Actx0/Gctx0"
            )

            func main() {
            	client := gctx0.NewClient(
            		gctx0.WithAccessKey("YOUR_ACCESS_KEY"),
            		gctx0.WithWorkspaceId("YOUR_WORKSPACE_ID"),
            	)
            	defer client.Close()
            	ctx := context.Background()
            	agents, err := client.Agent.List(ctx, 50, 0)
            	_ = agents
            	_ = err
            }
        - lang: bash
          label: cli
          source: |
            export ACTX0_ACCESS_KEY="YOUR_ACCESS_KEY"
            export ACTX0_WORKSPACE_ID="YOUR_WORKSPACE_ID"

            acli agent list --limit 50 --offset 0
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      operationId: createAgent
      summary: Create Agent
      description: Create an agent in a workspace. Handle is generated automatically.
      tags:
      - Agents
      security: *id002
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-agent
      x-codeSamples:
        - lang: python
          label: pctx0
          source: |
            from pctx0 import Pctx0Client

            client = Pctx0Client(
                access_key="YOUR_ACCESS_KEY",
                workspace_id="YOUR_WORKSPACE_ID",
            )

            agent = client.agent.create(
                name="Support bot",
                description="Handles customer tickets",
            )
        - lang: javascript
          label: nctx0
          source: |
            import { Nctx0Client } from "@actx0/nctx0";

            const client = new Nctx0Client({
              accessKey: "YOUR_ACCESS_KEY",
              workspaceId: "YOUR_WORKSPACE_ID",
            });

            const agent = await client.agent.create({
              name: "Support bot",
              description: "Handles customer tickets",
            });
        - lang: go
          label: gtcx0
          source: |
            package main

            import (
            	"context"

            	"github.com/Actx0/Gctx0"
            )

            func main() {
            	client := gctx0.NewClient(
            		gctx0.WithAccessKey("YOUR_ACCESS_KEY"),
            		gctx0.WithWorkspaceId("YOUR_WORKSPACE_ID"),
            	)
            	defer client.Close()
            	ctx := context.Background()
            	agent, err := client.Agent.Create(ctx, "Support bot", "Handles customer tickets", gctx0.AgentWriteOptions{})
            	_ = agent
            	_ = err
            }
        - lang: bash
          label: cli
          source: |
            export ACTX0_ACCESS_KEY="YOUR_ACCESS_KEY"
            export ACTX0_WORKSPACE_ID="YOUR_WORKSPACE_ID"

            acli agent create "Support bot" --description "Handles customer tickets"
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              name: Support bot
              description: Handles customer support conversations
