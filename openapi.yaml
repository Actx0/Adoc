            - CAN_UPDATE_PROMPT
            - CAN_DELETE_PROMPT
            - CAN_LIST_WORKSPACE_DOCUMENTS
            - CAN_QUERY_WORKSPACE_DOCUMENTS
            - CAN_CREATE_WORKSPACE_DOCUMENT
            - CAN_DELETE_WORKSPACE_DOCUMENT
            - CAN_LIST_AGENTS
            - CAN_GET_AGENT
            - CAN_CREATE_AGENT
            - CAN_UPDATE_AGENT
            - CAN_DELETE_AGENT
            - CAN_LIST_AGENT_SESSIONS
            - CAN_GET_AGENT_SESSION
            - CAN_CREATE_AGENT_SESSION
            - CAN_UPDATE_AGENT_SESSION
            - CAN_DELETE_AGENT_SESSION
            - CAN_LIST_SESSION_MESSAGES
            - CAN_GET_SESSION_MESSAGE
            - CAN_QUERY_SESSION_MESSAGES
            - CAN_CREATE_SESSION_MESSAGE
            - CAN_UPDATE_SESSION_MESSAGE
            - CAN_DELETE_SESSION_MESSAGE
            - CAN_LIST_SESSION_MEMORIES
            - CAN_GET_SESSION_MEMORY
            - CAN_QUERY_SESSION_MEMORIES
            - CAN_CREATE_SESSION_MEMORY
            - CAN_UPDATE_SESSION_MEMORY
            - CAN_DELETE_SESSION_MEMORY
          example:
          - CAN_CREATE_AGENT_SESSION
          - CAN_GET_AGENT_SESSION
          - CAN_CREATE_SESSION_MEMORY
          - CAN_LIST_SESSION_MEMORIES
          - CAN_QUERY_SESSION_MEMORIES
    AccessKey:
      type: object
      required:
      - id
      - workspaceId
      - name
      - permissions
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 99999999-9999-9999-9999-999999999999
        workspaceId:
          type: string
          format: uuid
          example: 11111111-1111-1111-1111-111111111111
        name:
          type: string
          example: Agent runtime
        permissions:
          type: array
          items:
            type: string
          example:
          - CAN_CREATE_SESSION_MEMORY
          - CAN_LIST_SESSION_MEMORIES
        expiresAt:
          type: string
          format: date-time
          example: '2027-01-01T00:00:00Z'
        createdAt:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-07-01T12:00:00Z'
        key:
          type: string
          description: Raw secret. Returned only on create. Send as X-Access-Key.
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
    AccessKeyList:
