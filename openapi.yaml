      operationId: listAgents
      summary: List Agents
      description: List agents in a workspace.
      tags:
      - Agents
      security: &id002
      - AccessKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
