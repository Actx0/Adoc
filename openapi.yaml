openapi: 3.1.0
info:
  title: Actx0 API
  version: 1.0.0
  description: |-
    REST API for Actx0 workspaces, access keys, agents, sessions, messages, memories, prompts, and knowledge documents.

    Authenticate with `X-Access-Key` (workspace runtime), `X-API-Key` (user), or the `_actx0_session` cookie (dashboard).
servers:
- url: https://app.actx0.com/api/v1
  description: Actx0 cloud
- url: http://127.0.0.1:8000/api/v1
  description: Local Actx0 server
- url: https://{host}/api/v1
  description: Custom host
  variables:
    host:
      default: app.actx0.com
      description: Actx0 API host
tags:
- name: API Keys
  description: User API keys for X-API-Key auth
- name: Workspaces
  description: Multi-tenant workspaces
- name: Access Keys
  description: Scoped workspace keys for agents and SDKs
- name: Agents
  description: Agents inside a workspace
- name: Sessions
  description: Agent conversation sessions
- name: Messages
  description: Session messages and semantic search
- name: Memories
  description: Session memories, search, batch, and regenerate
- name: Prompts
  description: Versioned prompts
- name: Knowledge
  description: Document upload and semantic search
paths:
  /apiKeys:
    post:
      operationId: createApiKey
      summary: Create API Key
      description: Create a user API key. The raw `key` is returned once and is used as `X-API-Key`. Requires
        a user principal (session or existing API key). Access keys cannot manage API keys.
      tags:
      - API Keys
      security: &id001
      - ApiKeyAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-api-key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
            example:
              name: CI key
              expiresAt: '2027-01-01T00:00:00Z'
    get:
      operationId: listApiKeys
      summary: List API Keys
      description: List API keys for the authenticated user. Raw secrets are never returned.
      tags:
      - API Keys
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-api-keys
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /apiKeys/{apiKeyId}:
    get:
      operationId: getApiKey
      summary: Get API Key
      description: Fetch API key metadata by ID. The raw secret is not returned.
      tags:
      - API Keys
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/get-api-key
      parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      operationId: deleteApiKey
      summary: Delete API Key
      description: Revoke and delete a user API key.
      tags:
      - API Keys
      security: *id001
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
