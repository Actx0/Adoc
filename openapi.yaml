      parameters:
      - $ref: '#/components/parameters/ApiKeyId'
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create Workspace
      description: Create a workspace and add the authenticated user as owner. Free users are limited
        to one owned workspace.
