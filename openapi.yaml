components:
  securitySchemes:
    AccessKeyAuth:
      type: apiKey
      in: header
      name: X-Access-Key
      description: Workspace access key for agent/runtime integrations.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: User API key for management and automation.
    SessionCookie:
      type: apiKey
      in: cookie
      name: _actx0_session
      description: Browser session cookie used by the Actx0 dashboard.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 11111111-1111-1111-1111-111111111111
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 22222222-2222-2222-2222-222222222222
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Internal session UUID (not externalId).
      schema:
        type: string
        format: uuid
      example: 33333333-3333-3333-3333-333333333333
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 44444444-4444-4444-4444-444444444444
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 55555555-5555-5555-5555-555555555555
    PromptId:
      name: promptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 66666666-6666-6666-6666-666666666666
    PromptVersionId:
      name: promptVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 77777777-7777-7777-7777-777777777777
    PromptName:
      name: promptName
      in: path
      required: true
      description: Prompt handle or name used with promptsByName.
      schema:
        type: string
      example: support-system-prompt
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 88888888-8888-8888-8888-888888888888
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 99999999-9999-9999-9999-999999999999
    ApiKeyId:
      name: apiKeyId
