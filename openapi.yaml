openapi: 3.1.0
info:
  title: Actx0 API
  version: 1.0.0
  description: |-
    REST API for Actx0 workspaces, access keys, agents, sessions, messages, memories, prompts, and knowledge documents.

    Authenticate with `X-Access-Key` (workspace runtime), `X-API-Key` (user), or the `_actx0_session` cookie (dashboard).
servers:
- url: http://127.0.0.1:8000/api/v1
  description: Local Actx0 server
- url: https://{host}/api/v1
  description: Custom host
  variables:
    host:
      default: api.actx0.com
      description: Actx0 API host
tags:
- name: API Keys
  description: User API keys for X-API-Key auth
- name: Workspaces
  description: Multi-tenant workspaces
- name: Access Keys
  description: Scoped workspace keys for agents and SDKs
- name: Agents
  description: Agents inside a workspace
- name: Sessions
  description: Agent conversation sessions
- name: Messages
  description: Session messages and semantic search
- name: Memories
  description: Session memories, search, batch, and regenerate
- name: Prompts
  description: Versioned prompts
- name: Knowledge
  description: Document upload and semantic search
paths:
  /apiKeys:
    post:
      operationId: createApiKey
      summary: Create API Key
      description: Create a user API key. The raw `key` is returned once and is used as `X-API-Key`. Requires
        a user principal (session or existing API key). Access keys cannot manage API keys.
      tags:
      - API Keys
      security: &id001
      - ApiKeyAuth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-api-key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
            example:
              name: CI key
              expiresAt: '2027-01-01T00:00:00Z'
    get:
      operationId: listApiKeys
      summary: List API Keys
      description: List API keys for the authenticated user. Raw secrets are never returned.
      tags:
      - API Keys
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-api-keys
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /apiKeys/{apiKeyId}:
    get:
      operationId: getApiKey
      summary: Get API Key
      description: Fetch API key metadata by ID. The raw secret is not returned.
      tags:
      - API Keys
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/get-api-key
      parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      operationId: deleteApiKey
      summary: Delete API Key
      description: Revoke and delete a user API key.
      tags:
      - API Keys
      security: *id001
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/delete-api-key
      parameters:
      - $ref: '#/components/parameters/ApiKeyId'
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create Workspace
      description: Create a workspace and add the authenticated user as owner. Free users are limited
        to one owned workspace.
      tags:
      - Workspaces
      security: *id001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
            example:
              name: Acme Support
    get:
      operationId: listWorkspaces
      summary: List Workspaces
      description: List workspaces the authenticated user belongs to.
      tags:
      - Workspaces
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-workspaces
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get Workspace
      description: Fetch a workspace by ID. Requires a user principal with `CAN_GET_WORKSPACE`.
      tags:
      - Workspaces
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/get-workspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    put:
      operationId: updateWorkspace
      summary: Update Workspace
      description: Update workspace name. Requires a user principal with `CAN_UPDATE_WORKSPACE`.
      tags:
      - Workspaces
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/update-workspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
            example:
              name: Acme Support
    delete:
      operationId: deleteWorkspace
      summary: Delete Workspace
      description: Delete a workspace. Requires a user principal with `CAN_DELETE_WORKSPACE`.
      tags:
      - Workspaces
      security: *id001
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/delete-workspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
  /workspaces/{workspaceId}/keys:
    post:
      operationId: createAccessKey
      summary: Create Access Key
      description: Create a workspace access key. The raw `key` is returned once and is used as `X-Access-Key`
        for agent/runtime calls. Requires a user principal.
      tags:
      - Access Keys
      security: *id001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-access-key
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessKeyRequest'
            example:
              name: Agent runtime
              expiresAt: '2027-01-01T00:00:00Z'
              permissions:
              - CAN_CREATE_AGENT_SESSION
              - CAN_GET_AGENT_SESSION
              - CAN_CREATE_SESSION_MEMORY
              - CAN_LIST_SESSION_MEMORIES
              - CAN_QUERY_SESSION_MEMORIES
    get:
      operationId: listAccessKeys
      summary: List Access Keys
      description: List access keys for a workspace. Raw secrets are never returned.
      tags:
      - Access Keys
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKeyList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-access-keys
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
  /workspaces/{workspaceId}/keys/{keyId}:
    get:
      operationId: getAccessKey
      summary: Get Access Key
      description: Fetch access key metadata by ID.
      tags:
      - Access Keys
      security: *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessKey'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/get-access-key
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/KeyId'
    delete:
      operationId: deleteAccessKey
      summary: Delete Access Key
      description: Revoke and delete a workspace access key.
      tags:
      - Access Keys
      security: *id001
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/delete-access-key
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/KeyId'
  /workspaces/{workspaceId}/agents:
    get:
      operationId: listAgents
      summary: List Agents
      description: List agents in a workspace.
      tags:
      - Agents
      security: &id002
      - AccessKeyAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-agents
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      operationId: createAgent
      summary: Create Agent
      description: Create an agent in a workspace. Handle is generated automatically.
      tags:
      - Agents
      security: *id002
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              name: Support bot
              description: Handles customer support conversations
  /workspaces/{workspaceId}/agents/{agentId}:
    get:
      operationId: getAgent
      summary: Get Agent
      description: Fetch an agent by ID.
      tags:
      - Agents
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/get-agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
    put:
      operationId: updateAgent
      summary: Update Agent
      description: Update an agent's name and description.
      tags:
      - Agents
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/update-agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
            example:
              name: Support bot
              description: Handles customer support conversations
    delete:
      operationId: deleteAgent
      summary: Delete Agent
      description: Delete an agent.
      tags:
      - Agents
      security: *id002
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/delete-agent
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
  /workspaces/{workspaceId}/agents/{agentId}/sessions:
    get:
      operationId: listSessions
      summary: List Sessions
      description: 'List agent sessions. Optionally filter with `id` and/or labels. Identify sessions
        with the `id` query param and/or arbitrary label query params (every query key except `id`, `limit`,
        and `offset` becomes a label). Example: `?id=ticket-4821&userId=alice&channel=web`.'
      tags:
      - Sessions
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/list-sessions
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/SessionExternalId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    post:
      operationId: createSession
      summary: Create Session
      description: 'Create an agent session. Provide `id` and/or labels in the query string. If `id` is
        omitted, Actx0 generates an external id. Identify sessions with the `id` query param and/or arbitrary
        label query params (every query key except `id`, `limit`, and `offset` becomes a label). Example:
        `?id=ticket-4821&userId=alice&channel=web`.'
      tags:
      - Sessions
      security: *id002
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mint:
        href: /api-reference/create-session
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AgentId'
      - $ref: '#/components/parameters/SessionExternalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
